<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Kantin Sekolah</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="admin.html"><span>KS</span><strong>Admin Kantin</strong></a><nav><a class="active" href="admin.html">Kelola</a><a href="history.html">Transaksi</a><button class="link-button" data-logout>Keluar</button></nav></header><main class="page"><section class="section-heading"><div><p class="eyebrow">DASBOR ADMIN</p><h1>Operasional kantin</h1></div></section><section id="report-cards" class="report-grid"><p class="muted">Memuat laporan...</p></section><div class="admin-grid"><section class="card"><div class="section-heading"><h2>Menu & stok</h2><button id="new-menu" class="secondary">Tambah menu</button></div><div id="admin-menu-list" class="table-wrap"></div></section><section class="card"><div class="section-heading"><h2>Siswa</h2><button id="new-student" class="secondary">Tambah siswa</button></div><input id="student-search" type="search" placeholder="Cari nama, username, atau NIS"><div id="student-list" class="table-wrap"></div></section></div><section class="card"><div class="section-heading"><div><h2>Laporan harian</h2><p class="muted">Ringkasan otomatis transaksi sukses.</p></div><a href="history.html">Riwayat transaksi</a></div><div id="daily-reports" class="table-wrap"></div></section></main><dialog id="menu-dialog"><form id="menu-form" class="stack"><div class="section-heading"><h2 id="menu-dialog-title">Tambah menu</h2><button type="button" class="icon-button" data-close-dialog>&times;</button></div><input id="menu-id" type="hidden"><label>Nama menu<input id="menu-name" required maxlength="120"></label><label>Kategori<input id="menu-category" required value="Lainnya"></label><label>Harga (Rp)<input id="menu-price" required min="1" type="number"></label><label>Stok<input id="menu-stock" required min="0" type="number" value="0"></label><label class="toggle"><input id="menu-available" type="checkbox" checked> Tersedia untuk dibeli</label><p id="menu-error" class="error"></p><button type="submit">Simpan menu</button></form></dialog><dialog id="student-dialog"><form id="student-form" class="stack"><div class="section-heading"><h2>Tambah siswa</h2><button type="button" class="icon-button" data-close-student>&times;</button></div><label>Nama lengkap<input id="student-name-input" required maxlength="120"></label><label>Username<input id="student-username" required minlength="3" maxlength="40" placeholder="contoh: budi.123"></label><label>PIN awal (6 digit)<input id="student-password" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><label>NIS<input id="student-number"></label><label>Kelas<input id="student-class"></label><label>Saldo awal (Rp)<input id="student-balance" type="number" min="0" value="0" required></label><p id="student-error" class="error"></p><button type="submit">Buat akun siswa</button></form></dialog><script src="js/config.js"></script><script type="module" src="js/admin.js"></script></body></html>
