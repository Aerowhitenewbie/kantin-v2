<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk | Kantin Sekolah</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><main class="auth-card"><div class="brand"><span>KS</span><div><strong>Kantin Sekolah</strong><small>Bayar cepat, catatan rapi</small></div></div><h1>Selamat datang</h1><p class="muted">Masuk menggunakan akun kantin Anda.</p><form id="login-form" class="stack"><label>Username<input id="username" type="text" autocomplete="username" required minlength="3" maxlength="40" placeholder="contoh: budi.123"></label><label>PIN 6 digit<input id="password" type="password" inputmode="numeric" pattern="[0-9]{6}" autocomplete="current-password" required minlength="6" maxlength="6" placeholder="••••••"></label><p id="form-error" class="error" role="alert"></p><button type="submit">Masuk</button></form></main><script src="js/config.js"></script><script type="module" src="js/auth.js"></script></body></html>
